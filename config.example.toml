[log]
# valid levels are "debug", "info", "warn", "error"
level = "info"
# valid formats are "text" and "json"
format = "text"
# whether to add the log source to the log message
add_source = true
# log file name
file = "stmpdbot.log"
# max size in megabytes before log rotation
max_size = 500
# max age in days before log rotation
max_age = 30
# max number of log files to keep
max_backups = 3
# timezone for logs (IANA Time Zone database format, e.g., "Asia/Kolkata", "UTC", "America/New_York")
# defaults to "Asia/Kolkata" if not specified or invalid
timezone = "Asia/Kolkata"


[bot]
# add guild ids the commands should sync to, leave empty to sync globally
dev_guilds = []
# the bot token
token = "your_token_here"
# youtube api key
yt_api_key = "yt_api_key_here"
# google service json file path
google_service_file = "/path/to/servicefile.json"
# reddit script app credentials and the account it runs as
reddit_client_id = ""
reddit_client_secret = ""
reddit_bot_username = ""
reddit_bot_password = ""
# Optional proxy for Reddit's traffic, and only Reddit's: every other source
# still goes out directly. Leave empty to fetch Reddit directly as well.
# Accepts http://, https://, socks5:// and socks5h:// URLs. Under the limitless
# compose stack this is the home-network exit node, which the bot reaches by
# joining the tailscale-raspberrypi network:
#   reddit_proxy = "http://tailscale-raspberrypi:1080"
reddit_proxy = ""
# beatport credentials
beatport_username = ""
beatport_password = ""
# beatport label ID to monitor (STMPD RCRDS = 56009)
beatport_label_id = "56009"
# beatport artist IDs to monitor (Martin Garrix, AREA21, GRX, YTRAM)
beatport_artist_ids = ["185928", "626138", "368469", "898749"]
# maximum tracks to fetch per source on each check (use --fetch-all-beatport flag for initial import)
beatport_max_tracks = 50

[lavalink]
# lavalink server url
url = "http://localhost:2333"
# lavalink password
password = "youshallnotpass"

[database]
# db host
host = "localhost"
# db user
user= "postgres"
# db password
password = "password"
# db name
name = "garrixbot"
# db port
port = 5432

[health]
# listen address for the GET /health endpoint, used by the container
# HEALTHCHECK and by external uptime monitoring. Defaults to ":8081".
# Returns 200 when Discord and the database are both up, 503 otherwise.
# Lavalink is reported in the response but never fails the check, since the
# bot runs fine without it (radio features are simply disabled).
address = ":8081"

[internal]
# Listen address for the bot's internal API, which serves live guild data
# (roles, channels, member counts) to the dashboard from the disgo cache. This
# is how the dashboard renders role and channel names without ever holding the
# bot token. Container-internal only: never publish this port to the host.
address = ":8082"
# Shared secret the dashboard presents in the X-Internal-Token header. It must
# match dashboard.bot_api_secret below. Leaving it empty disables the API
# entirely rather than serving guild data unauthenticated.
#   openssl rand -hex 32
secret = ""

[dashboard]
# Read only by the dashboard binary (cmd/dashboard); the bot ignores this
# section, and the dashboard ignores [bot] and [lavalink].

# listen address for the web UI
address = ":8080"
# The externally reachable origin. An https:// value turns on Secure cookies
# and the __Host- cookie prefix, so getting this wrong in production ships
# insecure cookies -- it is not cosmetic.
public_base_url = "http://localhost:8080"

# Discord application credentials, from the Developer Portal.
client_id = ""
client_secret = ""
# Must match a redirect registered on the Discord application byte for byte.
redirect_uri = "http://localhost:8080/auth/callback"

# Keys the HMAC over the session cookie. At least 32 characters. Rotating it
# logs everyone out, which is the intended emergency response.
#   openssl rand -hex 32
session_secret = ""

# Where the bot's internal API lives, and the secret to present to it. Inside
# compose this is the bot's container name. bot_api_secret must equal
# internal.secret above; the dashboard refuses to start if they disagree.
bot_api_url = "http://127.0.0.1:8082"
bot_api_secret = ""

# Discord user IDs of app-level super admins, who may administer every server
# the bot is in regardless of their permissions there. Distinct from a
# server's own Discord owner. Everyone else needs Administrator in a server
# the bot is already a member of.
super_admin_ids = []

[llm]
# AI persona feature: replies when the bot is @mentioned or one of its
# messages is replied to. The bot only forwards the conversation to the
# standalone agent service below (cmd/agent) -- it never talks to an LLM
# directly and never holds the API key. Costs real API money per reply --
# leave enabled = false unless you mean to run it.
enabled = false
# cmd/agent's Address, e.g. "http://agent:8083" under docker compose.
agent_url = ""
# must equal [agent].secret below
agent_secret = ""
# how many hops up the Discord reply chain to walk for context
max_context_messages = 6
# minimum gap between two triggered responses to the same user
cooldown_seconds = 15

[agent]
# Read only by cmd/agent, the standalone process that holds the LLM API key
# and runs the persona's tool-calling loop. See stmpdbot/ai for what it does
# and how to remove it entirely.
#
# Under docker compose this same file is mounted into the bot and dashboard
# containers as well -- that is what keeps the database credentials and the
# [llm]/[agent] shared secret defined exactly once. The API key is the one
# thing that must NOT be written here for that reason: see api_key below.

# Listen address. Container-internal only -- never publish this port.
address = ":8083"
# must equal [llm].agent_secret above
#   openssl rand -hex 32
secret = ""
# an OpenAI-compatible chat completions endpoint, e.g. a personal LLM proxy
base_url = ""
# Leave EMPTY in any deployment that shares this file between containers, and
# set STMPD_AGENT_API_KEY on the agent service instead (compose reads it from
# .env) -- a key written here is readable inside the bot and dashboard
# containers too. Filling it in is fine for a local single-process run.
api_key = ""
model = ""
# cap on completion length, including tool-calling round-trips
max_tokens = 4096

# Long-term memory, held in a self-hosted mem0 instance shared with whatever
# else on the box stores memories. Leave memory_url empty to run without
# memory at all -- the persona then works exactly as it did before, it just
# does not remember anyone between conversations.
#
# Under docker compose this is http://mem0:8000, reached over the shared
# `mem0` network. Segregation from the other applications on that instance is
# by memory_agent_id, which is stamped on every memory written and filtered on
# every read -- one store, many tenants, no crosstalk.
memory_url = ""
# Same rule as api_key above: leave EMPTY in a deployment that shares this
# file between containers and set STMPD_MEM0_API_KEY on the agent service
# instead. Minted from mem0 with a label, so it can be revoked on its own.
memory_api_key = ""
# Defaults to "garrixbot" when empty. Must not collide with another
# application's id on the same instance.
memory_agent_id = "garrixbot"
# The nightly pass that folds messages the bot was never addressed in into
# memory. Defaults to true when absent. It is capped at 25 extraction calls a
# night -- on a busy server that is a couple of dollars a month -- but it is
# the only part of this feature that spends on its own schedule, so it has its
# own switch. Turning it off leaves memory fully working; the bot just stops
# learning from conversations it was not part of.
memory_digest_enabled = true

[storage]
# Where rank card background images live. Read by both the bot and the
# dashboard. Empty defaults to "assets/backgrounds" -- the images baked into
# the bot's own image -- which is what makes local/dev work unconfigured. In
# production this should point at a directory mounted into both the bot and
# dashboard containers, so an upload through the dashboard is immediately
# usable by the bot.
backgrounds_dir = ""
