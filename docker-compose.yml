services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: stmpd-lavalink
    labels:
      # Pinned to the 4.x line: WUD reports, never applies.
      - "wud.trigger.exclude=docker.local"
      # The {1,2} bound is the point: Lavalink also publishes commit-hash tags
      # like `9930779-alpine`, which a plain \d+ would happily treat as
      # version 9,930,779 and rank above everything forever.
      - 'wud.tag.include=^\d{1,2}(\.\d+)*-alpine$$'
    restart: unless-stopped
    environment:
      # JVM heap. Override LAVALINK_HEAP in .env per host - the previous hardcoded
      # 6G exceeds total RAM on smaller boxes, which risks the OOM killer.
      - _JAVA_OPTIONS=-Xmx${LAVALINK_HEAP:-1G}
      - TZ=Asia/Kolkata
      # OAuth refresh token for the YouTube plugin. Kept out of application.yml
      # because that file is committed; Lavalink is Spring Boot, so this env var
      # maps onto plugins.youtube.oauth.refreshToken via relaxed binding.
      # Empty is valid: Lavalink then prints a device code to authorise.
      - PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN=${YOUTUBE_REFRESH_TOKEN:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins/:/opt/Lavalink/plugins/
      # Lavalink writes its own logs to ./logs inside the container. Without this bind
      # the only record of a YouTube breakage is whatever the bot happens to log, which
      # is how the 2026-08-18 TV-client outage went undiagnosed for ten days.
      # The container runs as uid 322, so the host dir must be writable by it:
      #   docker exec -u 0 stmpd-lavalink chown 322:65533 /opt/Lavalink/logs
      - ./lavalink/logs/:/opt/Lavalink/logs/
      - /usr/lib/x86_64-linux-gnu/libudev.so.1:/usr/lib/x86_64-linux-gnu/libudev.so.1:ro
    networks:
      - stmpdbot
    expose:
      - 2333
  bot:
    image: ghcr.io/milindmadhukar/stmpdbot:main
    container_name: stmpdbot
    labels:
      # Rolling tag (:main): not semver, so digest watching is what makes it
      # visible to WUD at all. With no trigger.exclude, docker.local auto-applies
      # a new digest, which is how a push to main reaches the box.
      - "wud.watch.digest=true"
    volumes:
      - ./config.docker.toml:/var/lib/config.toml
      - ./stmpd-google-service.json:/etc/secrets/stmpd-google-service.json
      - ./stmpdbot.log:/bot/stmpdbot.log
      # Rank card backgrounds. Shared with the dashboard container below (same
      # host path, same container path) so an upload through the dashboard is
      # immediately usable here without a redeploy. Points at storage.backgrounds_dir
      # in config.docker.toml. Seeded with the built-in images on first boot.
      - ./backgrounds/:/data/backgrounds/
    command: -config=/var/lib/config.toml --sync-commands=true
    # The host clock is UTC and stays that way; every service on it declares its own
    # display timezone, which is how frappe, traefik, authelia and wud are set up.
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped
    networks:
      - stmpdbot
      - db
    depends_on:
      - lavalink
    expose:
      # Internal control plane for the dashboard. expose, not ports: it is
      # reachable on the stmpdbot network only and must never be published.
      - 8082

  agent:
    image: ghcr.io/milindmadhukar/stmpdbot-agent:main
    container_name: stmpdbot-agent
    labels:
      # Same rolling-tag digest watch as bot/dashboard, so a push to main
      # redeploys this on its own -- the entire point of splitting it out.
      - "wud.watch.digest=true"
    volumes:
      # The same file the bot reads. The database credentials and the
      # [llm]/[agent] shared secret therefore exist exactly once; this
      # refuses to start if its copy of the secret is empty.
      - ./config.docker.toml:/var/lib/config.toml
    command: -config=/var/lib/config.toml
    environment:
      - TZ=Asia/Kolkata
      # The LLM API key, deliberately NOT in config.docker.toml: that file is
      # mounted into the bot and dashboard containers too, so a key written
      # there would be readable in all three. This is the only service that
      # gets it. Set STMPD_AGENT_API_KEY in .env alongside LAVALINK_HEAP.
      - STMPD_AGENT_API_KEY=${STMPD_AGENT_API_KEY:?set STMPD_AGENT_API_KEY in .env}
      # mem0 API key, kept out of config.docker.toml for exactly the same
      # reason as the one above. Minted in mem0 with the label "garrixbot" so
      # it is revocable without touching the other applications' keys.
      - STMPD_MEM0_API_KEY=${STMPD_MEM0_API_KEY:?set STMPD_MEM0_API_KEY in .env}
    restart: unless-stopped
    networks:
      - stmpdbot       # reached by the bot's internal HTTP call
      - db             # reaches postgres
      # Shared memory network, created outside this file with
      # `docker network create mem0`. Reaches the mem0 API as
      # http://mem0:8000. Other applications (hermes, wizard) share that
      # instance; agent_id keeps their memories and ours apart.
      - mem0
    # No `ports:` on purpose -- reachable only from the bot, over the
    # internal stmpdbot network, same as the bot's own internal API.
    expose:
      - 8083

  dashboard:
    image: ghcr.io/milindmadhukar/stmpdbot-dashboard:main
    container_name: stmpdbot-dashboard
    volumes:
      # The same file the bot reads. The database credentials and the
      # internal-API shared secret therefore exist exactly once; the dashboard
      # refuses to start if its copy of the secret disagrees with the bot's.
      - ./config.docker.toml:/var/lib/config.toml
      # Same host path as the bot's mount above -- this is what makes an
      # upload here show up on the bot's next /rank render.
      - ./backgrounds/:/data/backgrounds/
    command: -config=/var/lib/config.toml
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped
    networks:
      - stmpdbot           # reaches the bot's internal API
      - db             # reaches postgres
      - reverse_proxy  # reached by traefik
    depends_on:
      - bot
    # No `ports:` on purpose -- traefik reaches 8080 over reverse_proxy, the
    # same way every other service on this host is published.
    expose:
      - 8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stmpddashboard.rule=Host(`bot.milind.dev`)"
      - "traefik.http.routers.stmpddashboard.entrypoints=websecure"
      - "traefik.http.routers.stmpddashboard.tls=true"
      - "traefik.http.routers.stmpddashboard.tls.certresolver=milindresolver"
      # No authelia middleware here, unlike the other services on this host.
      # Discord OAuth is the gate: the callback refuses to issue a session to
      # anyone who does not administer a server the bot is in, so an Authelia
      # login in front of it only blocked the very admins it exists for -- they
      # would need an account on this box as well as the Discord permission.
      #
      # That makes the eligibility check in oauth.go security-critical rather
      # than cosmetic. It fails closed: if the bot cannot be reached to say
      # which guilds it is in, no session is issued at all.
      - "traefik.http.services.stmpddashboard.loadbalancer.server.port=8080"
      # Same rolling-tag digest watch as the bot, so a push to main redeploys
      # both halves the same way.
      - "wud.watch.digest=true"

networks:
  stmpdbot:
    name: stmpdbot
  db:
    external: true
  # Shared memory network. Created outside this file, and joined by every
  # application on the box that reads or writes memories.
  mem0:
    external: true
  reverse_proxy:
    external: true
